# Fly.io skeleton — fill in the app name, then `fly launch` / `fly deploy`.
# Cost note: one shared-cpu-1x 256 MB machine, always on (offline = forfeited
# tasks). See README "Deploy" for the secret + registration steps.
app = "gatekeeper-agent-REPLACE-ME"
primary_region = "sin"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
